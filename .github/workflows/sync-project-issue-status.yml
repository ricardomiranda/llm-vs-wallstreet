name: Sync project issue status

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  sync-status:
    name: Update linked issue on the project board
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Set project status from pull request lifecycle
        uses: actions/github-script@v9
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          # GH_PROJECT_TOKEN must be a secret with Projects read/write access.
          script: |
            if (!process.env.GH_PROJECT_TOKEN) {
              core.notice("GH_PROJECT_TOKEN is not configured; skipping optional project-board sync.");
              return;
            }
            const body = context.payload.pull_request.body || "";
            const matches = [...body.matchAll(/(?:Closes|Fixes|Resolves)\s+#(\d+)/gi)];
            const issueNumbers = [...new Set(matches.map((match) => Number(match[1])))];
            if (issueNumbers.length !== 1) {
              core.setFailed("Expected exactly one closing issue reference in the PR body.");
              return;
            }

            const issueNumber = issueNumbers[0];
            const { owner, repo } = context.repo;
            const issueResult = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                }
              }`,
              { owner, repo, number: issueNumber },
            );
            const issueId = issueResult.repository.issue?.id;
            if (!issueId) {
              core.setFailed(`Issue #${issueNumber} was not found.`);
              return;
            }

            const projectResult = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id name options { id name }
                        }
                      }
                    }
                    items(first: 100) {
                      nodes { id content { ... on Issue { id number } } }
                    }
                  }
                }
              }`,
              { owner: "ricardomiranda", number: 3 },
            );
            const project = projectResult.user.projectV2;
            if (!project) {
              core.setFailed("Portfolio App Roadmap project #3 was not found.");
              return;
            }
            let item = project.items.nodes.find((node) => node.content?.id === issueId);
            if (!item) {
              const addResult = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $projectId,
                    contentId: $contentId
                  }) { item { id } }
                }`,
                { projectId: project.id, contentId: issueId },
              );
              item = { id: addResult.addProjectV2ItemById.item.id };
            }

            const statusField = project.fields.nodes.find((field) => field.name === "Status");
            if (!statusField) {
              core.setFailed("The project Status field was not found.");
              return;
            }

            const pr = context.payload.pull_request;
            let statusName;
            if (context.payload.action === "closed") {
              statusName = pr.merged ? "Done" : "In progress";
            } else if (pr.draft) {
              statusName = "In progress";
            } else {
              statusName = "In review";
            }
            const statusOption = statusField.options.find((option) => option.name === statusName);
            if (!statusOption) {
              core.setFailed(`Project Status option '${statusName}' was not found.`);
              return;
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`,
              {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: statusOption.id,
              },
            );
            core.info(`Moved issue #${issueNumber} to '${statusName}'.`);
