name: Sync Dependabot PR to project board

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read
  repository-projects: write

jobs:
  sync-dependabot-pr:
    name: Update Dependabot PR on project board
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Set project status for Dependabot pull request
        uses: actions/github-script@v7
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        with:
          github-token: ${{ secrets.GH_PROJECT_TOKEN || github.token }}
          script: |
            if (!process.env.GH_PROJECT_TOKEN) {
              core.notice("GH_PROJECT_TOKEN is not configured; skipping optional project-board sync.");
              return;
            }

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const projectResult = await github.graphql(
              `query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id name options { id name }
                        }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on PullRequest {
                            id number url repository { nameWithOwner }
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner: "ricardomiranda", number: 3 },
            );
            const project = projectResult.user.projectV2;
            if (!project) {
              core.setFailed("Portfolio App Roadmap project #3 was not found.");
              return;
            }

            let item = project.items.nodes.find(
              (node) =>
                node.content?.number === pr.number &&
                node.content?.repository?.nameWithOwner === `${owner}/${repo}`,
            );
            if (!item) {
              const addResult = await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $projectId,
                    contentId: $contentId
                  }) { item { id } }
                }`,
                { projectId: project.id, contentId: pr.node_id },
              );
              item = { id: addResult.addProjectV2ItemById.item.id };
            }

            const statusField = project.fields.nodes.find(
              (field) => field.name === "Status",
            );
            if (!statusField) {
              core.setFailed("The project Status field was not found.");
              return;
            }

            let statusName;
            if (context.payload.action === "closed") {
              statusName = pr.merged ? "Done" : "Backlog";
            } else if (pr.draft) {
              statusName = "In progress";
            } else {
              statusName = "In review";
            }
            const statusOption = statusField.options.find(
              (option) => option.name === statusName,
            );
            if (!statusOption) {
              core.setFailed(`Project Status option '${statusName}' was not found.`);
              return;
            }

            await github.graphql(
              `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) { projectV2Item { id } }
              }`,
              {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: statusOption.id,
              },
            );
            core.info(`Moved Dependabot PR #${pr.number} to '${statusName}'.`);
