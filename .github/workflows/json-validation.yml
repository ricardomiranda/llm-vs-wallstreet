name: JSON validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-json:
    name: Validate tracked JSON files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate tracked strict JSON
        run: python scripts/validate_json.py
