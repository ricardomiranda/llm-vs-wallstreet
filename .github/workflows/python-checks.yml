name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Provision project environment and dependencies
        run: make deps
      - name: Run unit tests
        run: >-
          .venv/bin/python -m coverage run --source=scripts
          -m unittest discover -s tests
      - name: Enforce 90% unit test coverage
        run: .venv/bin/python -m coverage report --fail-under=90

  mypy:
    name: Strict mypy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Provision project environment and dependencies
        run: make deps
      - name: Run strict mypy
        run: .venv/bin/python -m mypy
